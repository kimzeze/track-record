# Python/Django 백엔드 레포용 — 이 파일을 대상 레포의 .github/workflows/track-record.yml 에 복사하세요.
# 필요한 시크릿: ANTHROPIC_API_KEY, TARGET_TOKEN (옵션: SLACK_WEBHOOK_URL)

name: Track Record

on:
  pull_request:
    types: [closed]
    branches: [dev]  # 머지 흐름의 어느 단계에서 적립할지 — 조직 컨벤션에 따라 main 등으로 교체

jobs:
  curate:
    if: github.event.pull_request.merged == true
    uses: kimzeze/track-record/.github/workflows/curate.yml@main
    with:
      target_repo: "aptimizer-co/track-record-vault"  # 본인/조직 vault 로 교체
      # 옵션 — 기본값 쓰려면 생략
      # model_judge: "claude-haiku-4-5"
      # model_builder: "claude-sonnet-4-6"
      # diff_token_budget: 80000

      # Python 백엔드 기본 exclude:
      #   - lock/dep 파일 (poetry, pipenv, uv)
      #   - 테스트 (단, integration test 자체가 평가 시그널이면 빼지 말 것)
      # 의도적으로 migrations/*.py 는 exclude 에 포함하지 않음
      # → migration 안전성(schema-vs-data 분리, deferred index)을 백엔드 핵심 시그널로 평가하기 위함.
      # auto-generated migration 노이즈가 너무 많으면 ",migrations/*.py" 를 추가하세요.
      exclude_patterns: "poetry.lock,Pipfile.lock,uv.lock,*_test.py,tests/**,conftest.py"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
